[build]
command = "npm run build"
publish = "dist"

[[redirects]]
from = "/resume"
to = "/resume/"
status = 301

[[redirects]]
from = "/resume/*"
to = "/resume-site/:splat"
status = 200
force = true

[[redirects]]
from = "/bodybuilding"
to = "/bodybuilding/"
status = 301

[[redirects]]
from = "/bodybuilding/*"
to = "/bodybuilding/index.html"
status = 200

[[redirects]]
from = "/esports"
to = "/esports/"
status = 301

[[redirects]]
from = "/esports/*"
to = "/esports/index.html"
status = 200

[[redirects]]
from = "/*"
to = "/index.html"
status = 200
